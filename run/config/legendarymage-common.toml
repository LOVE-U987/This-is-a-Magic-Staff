[resurrectionRune]
	#Spell power multiplier for Resurrection Rune spell. Higher values make spell power more effective.
	#Default: 1.0 (100% effectiveness)
	#Range: 0.1 - 5.0
	# Default: 1.0
	# Range: 0.1 ~ 5.0
	spellPowerMultiplier = 1.0
	#Whether to enable buff effects for players and summons within the resurrection rune area.
	#Default: true
	buffEnabled = true
	#Interval in ticks between buff applications.
	#Default: 40 ticks (2 seconds)
	#Range: 20 - 200
	# Default: 40
	# Range: 20 ~ 200
	buffInterval = 40
	#Buff strength multiplier. Higher values make buffs stronger.
	#Default: 1.0 (100% effectiveness)
	#Range: 0.1 - 3.0
	# Default: 1.0
	# Range: 0.1 ~ 3.0
	buffMultiplier = 1.0

[pyromaniac]
	#Base explosion power for Pyro Flame effect when entity dies.
	#Default: 1.0
	#Range: 0.5 - 3.0
	# Default: 1.0
	# Range: 0.5 ~ 3.0
	explosionBasePower = 1.0
	#Additional explosion power per buff level.
	#Default: 0.3
	#Range: 0.1 - 1.0
	# Default: 0.3
	# Range: 0.1 ~ 1.0
	explosionPowerPerLevel = 0.3
	#Whether Pyro Flame explosion can destroy blocks.
	#Default: false (safe explosion)
	explosionDestroyBlocks = false
	#Whether Pyro Flame explosion can cause fire.
	#Default: false
	explosionCauseFire = false
	#Whether Pyromaniac spell can affect allies and summons.
	#Default: false (will not affect allies)
	affectAllies = false
	#Whether Pyromaniac spell can affect summons.
	#Default: false (will not affect summons)
	affectSummons = false

[implosion]
	#Spell power multiplier for Implosion spell. Higher values make spell power more effective.
	#Default: 1.0 (100% effectiveness)
	#Range: 0.1 - 5.0
	# Default: 1.0
	# Range: 0.1 ~ 5.0
	spellPowerMultiplier = 1.0
	#Pull strength for Implosion spell. Higher values pull enemies faster.
	#Default: 0.8
	#Range: 0.1 - 2.0
	# Default: 0.8
	# Range: 0.1 ~ 2.0
	pullStrength = 0.8
	#Delay in ticks between pull and explosion for Implosion spell.
	#Default: 10 ticks (0.5 seconds)
	#Range: 0 - 60
	# Default: 10
	# Range: 0 ~ 60
	explosionDelayTicks = 10
	#Duration in seconds that targets are set on fire after explosion.
	#Default: 5 seconds
	#Range: 0 - 30
	# Default: 5
	# Range: 0 ~ 30
	fireDurationSeconds = 5

[livingIceSculpture]
	#Interval in ticks between spawning new ice sculptures.
	#Default: 40 ticks (2 seconds)
	#Range: 20 - 200
	# Default: 40
	# Range: 20 ~ 200
	spawnInterval = 40
	#Maximum number of ice sculptures that can exist simultaneously per spell cast.
	#Default: 8 sculptures
	#Range: 1 - 20
	# Default: 8
	# Range: 1 ~ 20
	maxSculptures = 8
	#Lifetime of ice sculpture in ticks before converting to living sculpture.
	#Default: 400 ticks (20 seconds)
	#Range: 100 - 1200
	# Default: 400
	# Range: 100 ~ 1200
	lifetimeTicks = 400
	#Base health for ice sculptures.
	#Default: 50.0
	#Range: 10.0 - 200.0
	# Default: 50.0
	# Range: 10.0 ~ 200.0
	healthBase = 50.0
	#Additional health per spell power point.
	#Default: 5.0
	#Range: 0.0 - 20.0
	# Default: 5.0
	# Range: 0.0 ~ 20.0
	healthPerSpellPower = 5.0
	#Base attack damage for living ice sculptures.
	#Default: 10.0
	#Range: 1.0 - 50.0
	# Default: 10.0
	# Range: 1.0 ~ 50.0
	damageBase = 10.0
	#Additional attack damage per spell power point.
	#Default: 1.0
	#Range: 0.0 - 5.0
	# Default: 1.0
	# Range: 0.0 ~ 5.0
	damagePerSpellPower = 1.0
	#Base shatter damage when ice sculpture is destroyed.
	#Default: 10.0
	#Range: 0.0 - 50.0
	# Default: 10.0
	# Range: 0.0 ~ 50.0
	shatterDamageBase = 10.0
	#Additional shatter damage per spell power point.
	#Default: 1.0
	#Range: 0.0 - 5.0
	# Default: 1.0
	# Range: 0.0 ~ 5.0
	shatterDamagePerSpellPower = 1.0
	#Lifetime of living ice sculpture entity in ticks before naturally shattering.
	#Default: 3600 ticks (3 minutes)
	#Range: 600 - 7200
	# Default: 3600
	# Range: 600 ~ 7200
	entityLifetimeTicks = 3600

[blizzard]
	#Spell power multiplier for Blizzard spell. Higher values make spell power more effective.
	#Default: 1.0 (100% effectiveness)
	#Range: 0.1 - 5.0
	# Default: 1.0
	# Range: 0.1 ~ 5.0
	spellPowerMultiplier = 1.0
	#Base range of the blizzard area in blocks.
	#Default: 8.0 blocks
	#Range: 1.0 - 20.0
	# Default: 8.0
	# Range: 1.0 ~ 20.0
	baseRange = 8.0
	#Additional range per spell level in blocks.
	#Default: 1.0 block per level
	#Range: 0.0 - 5.0
	# Default: 1.0
	# Range: 0.0 ~ 5.0
	rangePerLevel = 1.0
	#Base damage dealt by the blizzard per hit.
	#Default: 5.0 damage
	#Range: 1.0 - 50.0
	# Default: 5.0
	# Range: 1.0 ~ 50.0
	baseDamage = 5.0
	#Additional damage per spell level.
	#Default: 5.0 damage per level
	#Range: 0.0 - 20.0
	# Default: 5.0
	# Range: 0.0 ~ 20.0
	damagePerLevel = 5.0
	#Base duration of the blizzard in seconds.
	#Default: 20 seconds
	#Range: 5 - 60
	# Default: 20
	# Range: 5 ~ 60
	baseDurationSeconds = 20
	#Additional duration per spell level in seconds.
	#Default: 2 seconds per level
	#Range: 0 - 10
	# Default: 2
	# Range: 0 ~ 10
	durationPerLevel = 2
	#Interval between damage ticks in ticks.
	#Default: 10 ticks (0.5 seconds)
	#Range: 5 - 100
	# Default: 10
	# Range: 5 ~ 100
	damageIntervalTicks = 10
	#Whether Blizzard spell can affect allies and summons.
	#Default: false (will not affect allies)
	affectAllies = false
	#Whether Blizzard spell can affect summons.
	#Default: false (will not affect summons)
	affectSummons = false
	#Duration of slowness effect applied to targets in ticks.
	#Default: 40 ticks (2 seconds)
	#Range: 20 - 200
	# Default: 40
	# Range: 20 ~ 200
	slownessDurationTicks = 40
	#Amplifier (level) of slowness effect. 0 = level 1, 1 = level 2, etc.
	#Default: 1 (level 2 slowness)
	#Range: 0 - 4
	# Default: 1
	# Range: 0 ~ 4
	slownessAmplifier = 1

[elementalBurst]
	#Enable debug output for Elemental Burst spell to console.
	#Default: true (will output element type and damage info)
	debugOutput = true

[elementalBarrage]
	#Enable debug output for Elemental Barrage spell to console.
	#Default: true (will output orb type and damage info)
	debugOutput = true

[triDirectionalArrow]
	#Enable debug output for Tri Directional Arrow spell to console.
	#Default: true (will output arrow type and damage info)
	debugOutput = true

[elementalPrism]
	#Enable debug output for Elemental Prism spell to console.
	#Default: true (will output mark sharing and reaction info)
	debugOutput = true

[elementReaction]
	#Enable debug output for Element Reaction system to console.
	#This includes mark application, upgrades, and reaction triggers.
	#Default: true (will output debug info)
	debugOutput = true

[element_mark_icon]
	#Enable element mark icons displayed above entities' heads.
	#When enabled, icons representing active element marks will be rendered above entities.
	#Default: true
	enabled = true
	#Height offset for element mark icons above entity heads.
	#Higher values move the icons further above the entity.
	#Default: 0.5 blocks above entity height
	#Range: 0.1 - 3.0
	# Default: 0.5
	# Range: 0.1 ~ 3.0
	height_offset = 0.5
	#Scale of element mark icons.
	#Higher values make the icons larger.
	#Default: 1.0 (normal size)
	#Range: 0.5 - 3.0
	# Default: 1.0
	# Range: 0.5 ~ 3.0
	scale = 1.0
